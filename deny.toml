[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0", "CC0-1.0"]

[advisories]
yanked = "deny"
ignore = [
    # bincode 1 больше не сопровождается, но уязвимостей нет; syntect читает им
    # встроенные дампы синтаксисов и тем, которые мы не подменяем.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained, через syntect; только встроенные данные" },
]

[bans]
multiple-versions = "warn"
